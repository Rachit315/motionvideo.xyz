name: Feature request
description: Suggest an idea or improvement for MotionVideo.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before opening a new issue:

        - [Search existing issues](https://github.com/motionvideohq/motionvideo.xyz/issues) and upvote instead of duplicating.
        - Check whether the idea is already on the roadmap or was discussed in a closed issue.
        - For bugs, use the bug report template instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: A clear description of the use case or pain point. Why does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API sketches, examples, or mockups if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, or anything else that would help evaluate the request.
    validations:
      required: false
